<title>Pelitilastot</title>
<style>
:root{--neu:#4b5a73;--bg:#f3f4f6;--card:#fff;--ink:#14181f;--mut:#5b6472;--line:#d6dae1;--pri:#5b2d8c;--acc:#00a9dd;--pri-ink:#fff;--ok:#0f7a56;--bad:#c42b2b;--mid:#a85f00;--ace:#6b3fd0;--sel:#14181f}
@media (prefers-color-scheme:dark){:root{--neu:#5d6b86;--bg:#0e1116;--card:#181c23;--ink:#eef0f4;--mut:#9aa3b2;--line:#2c323d;--pri:#8c5bd1;--acc:#2cc4ee;--pri-ink:#fff;--ok:#1a9a70;--bad:#e0504f;--mid:#c47a10;--ace:#8a62ea;--sel:#eef0f4}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;overscroll-behavior:none}
html,body{background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;touch-action:manipulation}
#app{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.hide{display:none!important}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-weight:400;font-size:12px;color:var(--mut);display:block}
.ib{background:transparent;border:1px solid var(--line);border-radius:10px;min-width:42px;height:42px;font-size:20px;color:var(--ink)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45}
.wrap{padding:12px;max-width:760px;margin:0 auto}
.page{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.mut{color:var(--mut)}
.small{font-size:13px}
h2{font-size:15px;margin:16px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=tel],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);min-height:46px}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.gitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.gitem b{font-size:17px}
.gitem.fx{display:flex;align-items:center;gap:10px;border-left:5px solid var(--acc)}
/* etusivun yläosa: JyLen logo ja värit */
.hero{display:flex;align-items:center;gap:12px;padding:10px 14px 12px;padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(135deg,#3d1b63 0%,#5b2d8c 65%,#6d3aa6 100%);color:#fff;border-bottom:4px solid var(--acc)}
.hero img{height:62px;width:auto;display:block;flex:none}
.hero .ttl{flex:1;min-width:0;font-weight:800;font-size:19px;letter-spacing:.2px;line-height:1.15}
.hero .sub{display:block;font-weight:500;font-size:12px;opacity:.8;margin-top:2px}
.hero .ib{border-color:rgba(255,255,255,.35);color:#fff;background:rgba(255,255,255,.1)}
.teamsel{display:flex;gap:8px;margin-bottom:6px}
.teamsel .chip{flex:1;text-align:center;border-radius:12px;min-height:46px;font-weight:800;font-size:16px}
.teamsel .chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.nxt{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.pill{flex:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.pill.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
#net{position:fixed;right:8px;bottom:8px;z-index:50;background:#b42318;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:42%;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:16px;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .12s}
#toast.show{opacity:.97}
#toast.t-bad{background:var(--bad);color:#fff}#toast.t-ok{background:var(--ok);color:#fff}#toast.t-ace{background:var(--ace);color:#fff}#toast.t-mid{background:var(--mid);color:#fff}#toast.t-neu{background:var(--neu);color:#fff}
.banner{background:#fff4d6;color:#5c3d00;border-bottom:1px solid #f0d58a;padding:8px 12px;font-size:13px}
/* modal */
#modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 10px;font-size:19px}
.sheet .btns{display:flex;gap:8px;margin-top:14px}
.sheet .btns .btn{flex:1}
.prow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.prow input:first-child{width:62px;flex:none}
.prow .btn{min-height:46px;padding:0 12px}
/* game */
.gscreen{height:100%;display:flex;flex-direction:column}
.bar{display:flex;gap:8px;padding:6px 10px;align-items:center;background:var(--card);border-bottom:1px solid var(--line)}
.setc{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.setc button{background:transparent;width:42px;height:40px;font-size:20px;color:var(--ink)}
.setc span{min-width:62px;text-align:center;font-weight:800}
.setbtn{flex:none;height:40px;border-radius:10px;border:1px solid var(--pri);background:var(--card);padding:0 12px;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap}
.setbtn small{font-weight:700;font-size:12px;color:var(--pri)}
.undo{flex:1;min-width:0;height:40px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:14px;padding:0 10px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;padding:5px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.tabs .chip{flex:1;text-align:center;border-radius:10px;min-height:38px;padding:6px 4px;font-size:14px}
.gbody{flex:1;min-height:0;display:flex;flex-direction:column}
.gmain{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.gmain>*{flex-shrink:0}
/* matala (vaaka-asennossa oleva) näyttö: tiivis yläosa; tilasto- ja kirjausloki-välilehdillä koko sivu vierii, jotta taulukolle jää tilaa */
@media (max-height:520px){
.gscreen .top{padding-top:4px;padding-bottom:4px}.gscreen .bar{padding:3px 10px}.gscreen .tabs{padding:3px 10px}
.gscreen .tabs .chip{min-height:32px;padding:3px 4px}.setbtn,.undo,.setc button{height:34px}
.gscreen.flow{height:auto;min-height:100%}.gscreen.flow .gbody{display:block;min-height:0}.gscreen.flow .gmain{display:block;overflow:visible}
.gscreen.flow .tabs{position:sticky;top:0;z-index:5}
.gscreen .ab{height:44px;font-size:16px}.gscreen .ab.wide{font-size:14px}.gscreen .acts{padding-top:4px;padding-bottom:4px}.gscreen .arow{margin-bottom:4px}.gscreen .pc{min-height:60px}
}
.tsbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px}
.tsbar .btn{min-height:34px;padding:4px 12px;font-size:14px;text-decoration:none;color:inherit}
#tsframe{display:block;width:100%;height:calc(100% - 48px);border:0;background:#fff}
.lurow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 10px 0;font-size:14px}
.lurow .btn{min-height:34px;padding:4px 12px;font-size:14px}
/* pelaajaruudukko: kaikki pelaajat mahtuvat näkyviin ilman vieritystä, kortit skaalautuvat tilan mukaan (--cols, --rows asetetaan koodissa) */
.pgrid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px;padding:8px;flex:1 1 0;min-height:calc(var(--rows,3) * 52px);container-type:size}
.pgrid.c4{--sp:14px}.pgrid.c5{--sp:12px}
.pc{background:var(--card);border:2px solid var(--line);border-radius:14px;min-height:0;max-height:150px;padding:2px 4px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.15}
.pc b{font-size:clamp(18px,calc(100cqh / var(--rows,3) * .40),34px);font-weight:800;line-height:1}
.pc span{font-weight:700;font-size:clamp(11px,calc(100cqh / var(--rows,3) * .24),var(--sp,16px));letter-spacing:-.2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgrid.dense .pc i{display:none}
.pc small{display:none;font-size:12px;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc i{font-style:normal;font-size:12px;color:var(--mut);margin-top:1px;min-height:12px}
.pc.sel{background:var(--sel);border-color:var(--sel);color:var(--bg)}
.pc.sel small,.pc.sel i{color:var(--bg);opacity:.8}
.acts{background:var(--card);border-top:1px solid var(--line);padding:8px 8px max(8px,env(safe-area-inset-bottom))}
.selline{font-weight:800;font-size:16px;padding:0 4px 4px;min-height:30px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.selline>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl{max-width:80%;overflow:hidden;text-overflow:ellipsis;flex:none;font-style:normal;font-size:14px;color:#fff;border-radius:8px;padding:4px 10px;white-space:nowrap}
.fl.t-ok{background:var(--ok)}.fl.t-bad{background:var(--bad)}.fl.t-ace{background:var(--ace)}.fl.t-mid{background:var(--mid)}.fl.t-neu{background:var(--neu)}
.selline.none{color:var(--mut);font-weight:600}
.arow{display:flex;gap:6px;margin-top:5px}
.arow .lbl{width:76px;flex:none;font-size:12px;font-weight:700;color:var(--mut);display:flex;align-items:center}
.ab{flex:1;height:48px;border-radius:12px;color:#fff;font-weight:800;font-size:16px;line-height:1.05;padding:0 4px}
.ab.wide{flex:1.7;font-size:14px}
@media (min-width:820px){.ab.wide{font-size:17px}}
.ab:active{filter:brightness(.8);transform:scale(.98)}
.ab.ok{background:var(--ok)}.ab.bad{background:var(--bad)}.ab.mid{background:var(--mid)}.ab.ace{background:var(--ace)}.ab.neu{background:var(--neu)}
.acts.off .ab{opacity:.45}
@media (min-width:820px){.gbody{flex-direction:row}.acts{width:420px;flex:none;border-top:0;border-left:1px solid var(--line);overflow:auto}.ab{height:72px;font-size:18px}.pgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));grid-auto-rows:auto;flex:none;align-content:start;container-type:normal;min-height:0}.pgrid.dense .pc i{display:block}.pc{min-height:76px}.pc small{display:block}.pc span{font-size:14px}.pc b{font-size:26px}}
@media (min-width:820px) and (max-height:520px){.gscreen .pgrid.pgrid{grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);flex:1 1 0;min-height:calc(var(--rows,3) * 44px);container-type:size;align-content:stretch}.gscreen .pc{min-height:0}.gscreen .pc small{display:none}.gscreen .pgrid.dense .pc i{display:none}.gscreen .pc b{font-size:clamp(18px,calc(100cqh / var(--rows,3) * .40),28px)}.gscreen .pc span{font-size:clamp(11px,calc(100cqh / var(--rows,3) * .24),var(--sp,15px))}}
/* kuusikkonäkymä: passari+hakkuri / YP+libero / keskitorjujat, korttien koko skaalautuu tilaan */
.lbtns{display:flex;gap:6px}
.chip small{font-size:11px;opacity:.7;margin-left:4px;font-weight:600}
.court{display:flex;flex-direction:column;gap:6px;padding:6px 8px;flex:1 1 0;min-height:150px;container-type:size}
@container (max-height:215px){.court .pc small{display:none}}
.crow{display:flex;justify-content:center;gap:8px;flex:1 1 0;min-height:0}
.court .pc{flex:1 1 0;min-width:0;max-width:34%;max-height:none;min-height:0}
.court .pc b{font-size:clamp(20px,calc(100cqh / 3 * .44),42px)}
.court .pc span{font-size:clamp(12px,calc(100cqh / 3 * .21),20px)}
.court .pc small{display:block;font-size:clamp(10px,calc(100cqh / 3 * .15),13px)}
.court .pc i{display:none}
/* stats */
.score{display:flex;align-items:center;gap:6px}
.sbtn{width:40px;height:36px;border-radius:10px;font-size:22px;font-weight:800;line-height:1;background:var(--pri);color:#fff;padding:0}
.sbtn.opp{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.sv{background:transparent;display:flex;align-items:center;gap:5px;min-width:64px;justify-content:center;font-size:21px;font-weight:800;padding:0 2px;height:36px}
.sv i{font-style:normal;opacity:.45;font-weight:600}
.lbtns .btn{padding:4px 9px;font-size:13px}
.imgrow{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px 4px}.imgrow .btn{flex:1 1 30%;min-height:42px;font-size:14px;padding:6px 8px}
.boards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px 10px 0}

<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="net" class="hide">Ei verkkoyhteyttä – kirjaukset tallentuvat, kun yhteys palaa</div>

<script type="module">
/* =========================================================
   Perusapurit
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? `${+m[3]}.${+m[2]}.${m[1]}` : (s || ''); };
const num = p => parseInt(p.num, 10);
const byNum = (a, b) => (num(a) || 999) - (num(b) || 999) || a.name.localeCompare(b.name, 'fi');
const surname = n => (n || '').trim().split(/\s+/)[0] || '';
const POSN = { P: 'Passari', H: 'Hakkuri', Y: 'YP', K: 'Keskitorjuja', L: 'Libero' };
const WSTEPS = [['P', 'Passari', 1, 1], ['H', 'Hakkuri', 1, 1], ['Y', 'Yleispelaajat (YP)', 2, 2], ['K', 'Keskitorjujat', 2, 2], ['L', 'Libero (1–2)', 1, 2]];
const firstname = n => (n || '').trim().split(/\s+/).slice(1).join(' ');
function setPath(o, path, val) { const k = path.split('.'); let c = o; for (const x of k.slice(0, -1)) c = (c[x] ??= {}); c[k.at(-1)] = val; }
function resInfo(g) {
  const parts = []; let w = 0, l = 0;
  for (const k of Object.keys(g.res || {}).sort()) { const r = g.res[k]; if (r.us != null && r.opp != null) { parts.push(`${r.us}–${r.opp}`); if (r.us > r.opp) w++; else if (r.us < r.opp) l++; } }
  return { w, l, parts, any: parts.length > 0 };
}
const resTxt = g => { const r = resInfo(g); return r.any ? `${r.w}–${r.l} (${r.parts.join(', ')})` : ''; };
const normName = n => (n || '').toLowerCase().replace(/\s+/g, ' ').trim();

const TYPES = ['srv_ok', 'srv_err', 'srv_ace', 'pt', 'att_in', 'err', 'blk', 'blk_soft', 'net', 'rec_good', 'rec_mid', 'rec_err'];
const LABEL = { srv_ok: 'Syöttö onnistui', srv_err: 'Syöttövirhe', srv_ace: 'Ässä', pt: 'Hyökkäyspiste', att_in: 'Hyökkäys pelissä', err: 'Hyökkäysvirhe', blk: 'Torjunta', blk_soft: 'Vaimennus', net: 'Verkkovirhe', rec_good: 'Vastaanotto hyvä', rec_mid: 'Vastaanotto: keskihyökkäys ei mahdollinen', rec_err: 'Vastaanottovirhe' };
// värit: vihreä = hyvä, keltainen/oranssi = neutraali (peli jatkuu), punainen = virhe
const TONE = { srv_ace: 'ok', srv_ok: 'mid', srv_err: 'bad', rec_good: 'ok', rec_mid: 'mid', rec_err: 'bad', pt: 'ok', att_in: 'mid', err: 'bad', blk: 'ok', blk_soft: 'mid', net: 'bad' };
const ACTIONS = [
  { grp: 'Syöttö', items: [['srv_ace', 'Ässä'], ['srv_ok', 'Onnistui'], ['srv_err', 'Virhe']] },
  { grp: 'Vastaanotto', items: [['rec_good', 'Hyvä'], ['rec_mid', 'Keskihyökkäys ei mahdollinen'], ['rec_err', 'Virhe']] },
  { grp: 'Hyökkäys', items: [['pt', 'Piste'], ['att_in', 'Pelissä'], ['err', 'Virhe']] },
  { grp: 'Torjunta', items: [['blk', 'Torjunta'], ['blk_soft', 'Vaimennus'], ['net', 'Verkkovirhe']] },
];

/* =========================================================
   Tila
   ========================================================= */
const S = {
  code: null, name: LS.get('bs_name', ''), devId: LS.get('bs_dev', null),
  teams: [], teamsLoaded: false, teamId: LS.get('bs_team', null),
  games: [], game: undefined, events: [], seasonGames: [],
  sel: null, tab: null, setFilter: 'all', draft: null,
  subs: [], view: null, teamsUnsub: null
};
if (!S.devId) { S.devId = uid() + uid(); LS.set('bs_dev', S.devId); }
let backend = null;
const app = $('#app');

/* =========================================================
   Taustajärjestelmä 1: paikallinen testitila (localStorage)
   ========================================================= */
function bump(g, ev, d) {
  const inc = (keys) => { let o = g; for (const k of keys.slice(0, -1)) o = (o[k] ??= {}); const l = keys.at(-1); o[l] = (o[l] || 0) + d; };
  inc(['tot', ev.pid, ev.type]); inc(['sets', 's' + ev.set, ev.pid, ev.type]); g.n = (g.n || 0) + d;
}
function makeLocal(code) {
  const key = 'bs_local_' + code;
  const db = LS.get(key, null) || { teams: {}, games: {}, events: {} };
  const subs = new Set();
  const save = () => { LS.set(key, db); [...subs].forEach(f => f()); };
  const watch = (compute, cb) => { const f = () => cb(structuredClone(compute())); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); };
  return {
    local: true,
    async hasSpace() { return LS.get(key, null) !== null; },
    async createSpace() { save(); },
    watchTeams: cb => watch(() => Object.values(db.teams), cb),
    watchFixtures: cb => watch(() => Object.values(db.fixtures ||= {}), cb),
    async saveFixtures(list) { db.fixtures ||= {}; for (const o of list) db.fixtures['m' + o.no] = o; save(); },
    async saveTeam(t) { t.id = t.id || uid(); db.teams[t.id] = t; save(); return t.id; },
    watchGames: (tid, cb) => watch(() => Object.values(db.games).filter(g => g.teamId === tid), cb),
    watchAllGames: (tid, cb) => watch(() => Object.values(db.games).filter(g => g.teamId === tid), cb),
    watchGame: (gid, cb) => watch(() => db.games[gid] || null, cb),
    watchEvents: (gid, cb) => watch(() => (db.events[gid] || []).slice(-300).reverse(), cb),
    async createGame(g) { const id = g.id || uid(); db.games[id] = { ...(db.games[id] || { tot: {}, sets: {}, n: 0 }), ...g, id }; db.events[id] ||= []; save(); return id; },
    async patchGame(gid, f) { if (db.games[gid]) { for (const [k, v] of Object.entries(f)) setPath(db.games[gid], k, v); save(); } },
    record(gid, ev) { const g = db.games[gid]; if (!g) return; bump(g, ev, 1); (db.events[gid] ||= []).push({ ...ev, id: uid(), ts: Date.now() }); save(); },
    undo(gid, ev) { const g = db.games[gid]; if (!g) return; bump(g, ev, -1); db.events[gid] = (db.events[gid] || []).filter(e => e.id !== ev.id); save(); },
    editEvent(gid, old, neu) { const g = db.games[gid]; if (!g) return; bump(g, old, -1); bump(g, neu, 1); const e = (db.events[gid] || []).find(x => x.id === old.id); if (e) Object.assign(e, { pid: neu.pid, type: neu.type, set: neu.set }); save(); },
    async deleteGame(gid) { delete db.games[gid]; delete db.events[gid]; save(); }
  };
}

/* =========================================================
   Taustajärjestelmä 2: Firebase Firestore
   ========================================================= */
let FB = null;
async function loadFirebase(cfg) {
  if (FB) return FB;
  const V = '10.12.2';
  const [a, f] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
  ]);
  const fapp = a.initializeApp(cfg);
  let db;
  try { db = f.initializeFirestore(fapp, { localCache: f.persistentLocalCache({ tabManager: f.persistentMultipleTabManager() }) }); }
  catch (e) { console.warn('Offline-välimuisti ei käytössä', e); db = f.getFirestore(fapp); }
  FB = { f, db };
  return FB;
}
function makeFirestore(code, { f, db }) {
  const col = (...p) => f.collection(db, 't', code, ...p);
  const dref = (...p) => f.doc(db, 't', code, ...p);
  const err = e => { console.error(e); toast('Yhteysvirhe: ' + (e.code || e.message), 'bad', 4000); };
  const inc = n => f.increment(n);
  return {
    local: false,
    async hasSpace() { return (await f.getDoc(dref('meta', 'info'))).exists(); },
    async createSpace() { await f.setDoc(dref('meta', 'info'), { created: Date.now() }); },
    watchTeams: cb => f.onSnapshot(col('teams'), s => cb(s.docs.map(d => ({ ...d.data(), id: d.id })), s.metadata.fromCache), err),
    watchFixtures: cb => f.onSnapshot(col('fixtures'), s => cb(s.docs.map(d => d.data())), err),
    async saveFixtures(list) { const b = f.writeBatch(db); for (const o of list) b.set(dref('fixtures', 'm' + o.no), o); b.commit().catch(err); },
    async saveTeam(t) {
      const id = t.id || f.doc(col('teams')).id;
      f.setDoc(dref('teams', id), { name: t.name, players: t.players, updated: Date.now() }).catch(err);
      return id;
    },
    watchGames: (tid, cb) => f.onSnapshot(f.query(col('games'), f.where('teamId', '==', tid)), s => cb(s.docs.map(d => ({ ...d.data(), id: d.id }))), err),
    watchAllGames: (tid, cb) => f.onSnapshot(f.query(col('games'), f.where('teamId', '==', tid)), s => cb(s.docs.map(d => ({ ...d.data(), id: d.id }))), err),
    watchGame: (gid, cb) => f.onSnapshot(dref('games', gid), s => cb(s.exists() ? { ...s.data(), id: s.id } : null), err),
    watchEvents: (gid, cb) => f.onSnapshot(f.query(col('games', gid, 'events'), f.orderBy('ts', 'desc'), f.limit(300)), s => cb(s.docs.map(d => ({ ...d.data(), id: d.id }))), err),
    async createGame(g) {
      const { id, ...data } = g;
      f.setDoc(dref('games', id), data, { merge: true }).catch(err);   // merge: ei koskaan nollaa jo kirjattuja tilastoja
      return id;
    },
    async patchGame(gid, fields) { f.updateDoc(dref('games', gid), fields).catch(err); },
    record(gid, ev) {
      const b = f.writeBatch(db);
      b.set(f.doc(col('games', gid, 'events')), { ...ev, ts: Date.now() });
      b.update(dref('games', gid), { [`tot.${ev.pid}.${ev.type}`]: inc(1), [`sets.s${ev.set}.${ev.pid}.${ev.type}`]: inc(1), n: inc(1) });
      b.commit().catch(err);   // ei odoteta: toimii myös ilman verkkoa
    },
    undo(gid, ev) {
      const b = f.writeBatch(db);
      b.delete(dref('games', gid, 'events', ev.id));
      b.update(dref('games', gid), { [`tot.${ev.pid}.${ev.type}`]: inc(-1), [`sets.s${ev.set}.${ev.pid}.${ev.type}`]: inc(-1), n: inc(-1) });
      b.commit().catch(err);
    },
    editEvent(gid, old, neu) {
      const d = {}, add = (ev, n) => { for (const k of [`tot.${ev.pid}.${ev.type}`, `sets.s${ev.set}.${ev.pid}.${ev.type}`]) d[k] = (d[k] || 0) + n; };
      add(old, -1); add(neu, 1);
      const upd = {}; for (const [k, v] of Object.entries(d)) if (v) upd[k] = inc(v);
      const b = f.writeBatch(db);
      b.update(dref('games', gid, 'events', old.id), { pid: neu.pid, type: neu.type, set: neu.set });
      if (Object.keys(upd).length) b.update(dref('games', gid), upd);
      b.commit().catch(err);
    },
    async deleteGame(gid) {
      const snap = await f.getDocs(col('games', gid, 'events'));
      for (let i = 0; i < snap.docs.length; i += 400) {
        const b = f.writeBatch(db);
        snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
        await b.commit();
      }
      await f.deleteDoc(dref('games', gid));
    }
  };
}
const useFirebase = () => { const c = window.FIREBASE_CONFIG; return !!(c && c.apiKey && !/TÄYTÄ|YOUR|XXXX/i.test(c.apiKey)); };
async function initBackend(code) {
  backend = useFirebase() ? makeFirestore(code, await loadFirebase(window.FIREBASE_CONFIG)) : makeLocal(code);
}

/* =========================================================
   UI-apurit: toast, modal, verkkotila, näyttö hereillä
   ========================================================= */
let toastT;
function toast(msg, tone = '', ms = 1300) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (tone ? ' t-' + tone : '');
  clearTimeout(toastT); toastT = setTimeout(() => { t.className = ''; }, ms);
}
const modalEl = $('#modal'), sheet = $('#sheet');
// iOS-asennetussa sovelluksessa näkymä voi jäädä siirtyneeksi (näppäimistö, vedot), jolloin napautukset osuvat ohi: palautetaan sijainti
const vvFix = () => { try { if (scrollX || scrollY) scrollTo(0, 0); } catch {} };
addEventListener('scroll', vvFix, { passive: true });
if (window.visualViewport) { visualViewport.addEventListener('scroll', vvFix); visualViewport.addEventListener('resize', vvFix); }
document.addEventListener('focusout', () => setTimeout(vvFix, 60));
addEventListener('pageshow', vvFix); addEventListener('orientationchange', () => setTimeout(vvFix, 300));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') vvFix(); });
function openModal(html) { vvFix(); sheet.innerHTML = html; modalEl.classList.add('open'); }
function closeModal() { vvFix(); modalEl.classList.remove('open'); sheet.innerHTML = ''; S.draft = null; S.edit = null; }
modalEl.addEventListener('click', e => { if (e.target === modalEl) closeModal(); });
function confirmModal(text, act, data = '') {
  openModal(`<h3>${esc(text)}</h3><div class="btns"><button class="btn" data-act="close">Peruuta</button><button class="btn pri" data-act="${act}" data-id="${esc(data)}">OK</button></div>`);
}
const setNet = () => $('#net').classList.toggle('hide', navigator.onLine);
addEventListener('online', setNet); addEventListener('offline', setNet); setNet();
let wake = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.view === 'game') keepAwake(); });

/* =========================================================
   Tilastolaskenta
   ========================================================= */
const g0 = (c, t) => (c && c[t]) || 0;
const sumC = c => TYPES.reduce((a, t) => a + g0(c, t), 0);
function calc(c) {
  const srv = g0(c, 'srv_ok') + g0(c, 'srv_err') + g0(c, 'srv_ace');
  const rec = g0(c, 'rec_good') + g0(c, 'rec_mid') + g0(c, 'rec_err');
  return {
    srv, srvOk: g0(c, 'srv_ok'), srvErr: g0(c, 'srv_err'), ace: g0(c, 'srv_ace'),
    srvPct: srv ? Math.round((g0(c, 'srv_ok') + g0(c, 'srv_ace')) / srv * 100) : null,
    att: g0(c, 'pt') + g0(c, 'att_in') + g0(c, 'err'), attIn: g0(c, 'att_in'),
    attPct: (g0(c, 'pt') + g0(c, 'att_in') + g0(c, 'err')) ? Math.round((g0(c, 'pt') - g0(c, 'err')) / (g0(c, 'pt') + g0(c, 'att_in') + g0(c, 'err')) * 100) : null,
    pt: g0(c, 'pt'), err: g0(c, 'err'), blk: g0(c, 'blk'), blkSoft: g0(c, 'blk_soft'), net: g0(c, 'net'),
    rec, recGood: g0(c, 'rec_good'), recMid: g0(c, 'rec_mid'), recErr: g0(c, 'rec_err'),
    recPct: rec ? Math.round(g0(c, 'rec_good') / rec * 100) : null,
    // +/-: pisteet (hyökkäys + ässä + torjunta) miinus virheet (hyökkäysvirhe + syöttövirhe + verkkovirhe + vastaanottovirhe)
    pts: g0(c, 'pt') + g0(c, 'srv_ace') + g0(c, 'blk'),
    pm: g0(c, 'pt') + g0(c, 'srv_ace') + g0(c, 'blk') - (g0(c, 'err') + g0(c, 'srv_err') + g0(c, 'net') + g0(c, 'rec_err'))
  };
}
const addC = (a, b) => { const o = { ...a }; for (const t of TYPES) if (b && b[t]) o[t] = (o[t] || 0) + b[t]; return o; };
// pistetilanne: lasketaan kirjauksista (meille pisteet, vastustajalle meidän virheet) + käsin lisätyt (g.man)
function scoreOf(g, n) {
  let us = 0, opp = 0;
  for (const c of Object.values(g.sets?.['s' + n] || {})) { us += g0(c, 'pt') + g0(c, 'srv_ace') + g0(c, 'blk'); opp += g0(c, 'err') + g0(c, 'srv_err') + g0(c, 'net') + g0(c, 'rec_err'); }
  const m = g.man?.['s' + n] || {};

function allFixtures() {

  for (const o of window.OTTELUT || []) m.set(String(o.no), o);

const isOwn = n => /jyle|jyväs/i.test(n || '');
function parseFixtures(text) {
  const L = String(text || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean), out = [], now = Date.now();
  for (let i = 4; i < L.length; i++) {
    const m = /^#(\d{3,8})$/.exec(L[i]); if (!m) continue;
    const d = /^(?:ma|ti|ke|to|pe|la|su)\.?\s+(\d{1,2})\.(\d{1,2})\.?\s+(\d{1,2})[:.](\d{2})/i.exec(L[i + 1] || ''); if (!d) continue;
    const y0 = new Date().getFullYear(); let dt = new Date(y0, +d[2] - 1, +d[1], 12);
    if (dt.getTime() < now - 120 * 864e5) dt = new Date(y0 + 1, +d[2] - 1, +d[1], 12);
    const home = L[i - 4], away = L[i - 3], cat = L[i - 2], venue = L[i - 1];
    out.push({ no: +m[1], home, away, cat, venue, date: `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`, time: `${pad(+d[3])}:${d[4]}`, opp: isOwn(home) && !isOwn(away) ? away : isOwn(away) && !isOwn(home) ? home : away });
  }
  return out;
}

  const agg = {}; for (const g of gs) for (const [pid, c] of Object.entries(g.tot || {})) if (sumC(c) > 0) agg[pid] = addC(agg[pid] || {}, c);

}

function seasonData() {
  const team = S.teams.find(t => t.id === S.seasonTeam); let agg = {}; const gp = {};
  for (const g of S.seasonGames) for (const [pid, c] of Object.entries(g.tot || {})) { if (sumC(c) > 0) { agg[pid] = addC(agg[pid] || {}, c); gp[pid] = (gp[pid] || 0) + 1; } }

function playerInsights(d) {

    if (x.ace >= 2 && x.ace / x.srv >= .1) str.push(`Syöttö tuottaa suoria pisteitä: ${x.ace} ässää (${P(pctOf(x.ace, x.srv))} syötöistä).`);

    else if (dv <= -8) dev.push(`Syöttö-% ${P(x.srvPct)} jää joukkueen keskiarvosta (${P(tx.srvPct)}).`);
  }

    if (dv >= 8) str.push(`Vahva vastaanotto: ${P(x.recPct)} hyviä (joukkue ${P(tx.recPct)}).`);
    if (x.recErr / x.rec >= .15) dev.push(`Vastaanottovirheitä ${x.recErr}/${x.rec} (${P(pctOf(x.recErr, x.rec))}). Keskity pallon alle ja vakaaseen perusasentoon.`);
    else if (dv <= -8) dev.push(`Vastaanotto-% ${P(x.recPct)} jää joukkueen keskiarvosta (${P(tx.recPct)}).`);
  }

    if (x.err / x.att >= .2) dev.push(`Hyökkäysvirheitä ${x.err}/${x.att} (${P(pctOf(x.err, x.att))}). Harjoittele pallon kontrollia ja maalin valintaa ennen lisävoimaa.`);
  }

    else if (pm <= -2) dev.push(`Virheitä enemmän kuin pisteitä: +/− keskimäärin ${fmtPM(Math.round(pm * 10) / 10).toString().replace('.', ',')} / peli. Selvitä missä osa-alueessa virheet syntyvät.`);
  }
  const tb = d.tgp ? tx.blk / d.tgp : 0;
  if (x.blk >= 3 && x.blk / n >= Math.max(1, tb * 1.5)) str.push(`Torjuu hyvin: ${x.blk} torjuntapistettä (${(x.blk / n).toFixed(1).replace('.', ',')} / peli).`);

  // Kehitys: viimeiset 3 peliä vs aiemmat
  if (n >= 4) {
    const a = rows.slice(0, -3).reduce((o, r) => addC(o, r.c), {}), b = rows.slice(-3).reduce((o, r) => addC(o, r.c), {}), xa = calc(a), xb = calc(b), k = rows.slice(0, -3).length;
    const cmp = (label, va, vb, na, nb, min) => { if (va == null || vb == null || na < min || nb < min) return; const df = vb - va; if (df >= 10) trd.push(`${label} noussut: ${P(va)} → ${P(vb)} (viimeiset 3 peliä vs. aiemmat).`); else if (df <= -10) trd.push(`${label} laskenut: ${P(va)} → ${P(vb)} (viimeiset 3 peliä vs. aiemmat). Tarkista syy: väsymys, pelipaikka tai rutiini.`); };
    cmp('Vastaanotto-%', xa.recPct, xb.recPct, xa.rec, xb.rec, 6); cmp('Syöttö-%', xa.srvPct, xb.srvPct, xa.srv, xb.srv, 6);
    if (d.hasInP && xa.att >= 6 && xb.att >= 6) cmp('Hyökkäystehokkuus', xa.attPct, xb.attPct, xa.att, xb.att, 6);
    const pa = xa.pts / k, pb = xb.pts / 3;
    if (pb - pa >= 1.5) trd.push(`Pisteitä enemmän: ${pa.toFixed(1).replace('.', ',')} → ${pb.toFixed(1).replace('.', ',')} / peli (viimeiset 3 vs. aiemmat).`);
    else if (pa - pb >= 1.5) trd.push(`Pisteitä vähemmän: ${pa.toFixed(1).replace('.', ',')} → ${pb.toFixed(1).replace('.', ',')} / peli (viimeiset 3 vs. aiemmat).`);
  }
  return { str, dev, trd };
}
function barChart(rows, f, { pct = false, cls = '' } = {}) {
  const W = 320, H = 110, top = 16, bot = 20, n = rows.length, vals = rows.map(r => f(r.x, r)), mx = pct ? 100 : Math.max(3, ...vals.map(v => v || 0));
  const slot = Math.min(44, (W - 8) / Math.max(n, 1)), bw = Math.max(8, slot * .6), ox = (W - slot * n) / 2, base = H - bot, ph = base - top;
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img"><line class="ax" x1="0" y1="${base}" x2="${W}" y2="${base}"/>`;
  vals.forEach((v, i) => {
    const cx = ox + slot * i + slot / 2, g = rows[i].g, dm = /^\d{4}-(\d{2})-(\d{2})$/.exec(g.date || ''), lab = dm ? `${+dm[2]}.${+dm[1]}.` : '';
    if (v == null) out += `<text x="${cx}" y="${base - 4}" text-anchor="middle">–</text>`;
    else { const h = Math.max(v > 0 ? 2 : 0, v / mx * ph); out += `<rect class="bar ${cls}" x="${cx - bw / 2}" y="${base - h}" width="${bw}" height="${h}" rx="3"/><text class="v" x="${cx}" y="${base - h - 3}" text-anchor="middle">${pct ? v : v}</text>`; }
    out += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${lab}</text>`;
  });
  return out + '</svg>';
}
function playerText(d, ins) {
  const x = d.x, L = [`${d.p.num ? d.p.num + ' ' : ''}${d.p.name} – ${d.team?.name || ''}, kausi (${d.rows.length} peliä)`, '',
    `Pisteet ${x.pts} (${(x.pts / Math.max(1, d.rows.length)).toFixed(1).replace('.', ',')}/peli), +/− ${fmtPM(x.pm)}`, `Syöttö ${x.srv ? P0(x.srvPct) + ' (' + x.srv + ' syöttöä, ' + x.ace + ' ässää)' : '–'}`, `Vastaanotto ${x.rec ? P0(x.recPct) + ' hyviä (' + x.rec + ' vast.)' : '–'}`, `Hyökkäyspisteet ${x.pt}, torjunnat ${x.blk}`, ''];
  const sec = (t, a) => { L.push(t); (a.length ? a : ['Ei vielä tarpeeksi dataa.']).forEach(s => L.push('• ' + s)); L.push(''); };
  sec('Vahvuudet', ins.str); sec('Kehityskohteet', ins.dev); if (ins.trd.length) sec('Kehitys', ins.trd);
  return L.join('\n').trim();
}
const P0 = v => v == null ? '–' : v + ' %';
function updatePlayer() {
  if (S.view !== 'player') return;
  const d = playerData(S.seasonTeam, S.plId), x = d.x, n = d.rows.length, ins = playerInsights(d);
  const list = a => a.length ? a.map(s => `<li>${esc(s)}</li>`).join('') : '';
  const none = t => `<li class="none">${t}</li>`;
  const kpi = (v, l, sub = '') => `<div class="kpi"><b>${v}</b><span>${l}</span>${sub ? `<small>${sub}</small>` : ''}</div>`;
  const trs = d.rows.map(r => { const y = r.x; return `<tr><td class="n">${esc(fmtDate(r.g.date).replace(/\.\d{4}$/, '.'))} ${esc(r.g.opponent || '')}</td><td><b>${y.pts}</b></td><td class="${y.pm > 0 ? 'v-ok' : y.pm < 0 ? 'v-bad' : ''}"><b>${fmtPM(y.pm)}</b></td><td class="g">${y.srv}</td><td>${y.ace}</td><td>${y.srvErr}</td><td>${pct(y.srvPct)}</td><td class="g">${y.pt}</td><td>${y.err}</td><td>${d.hasInP ? pct(y.attPct) : '–'}</td><td class="g">${y.blk}</td><td>${y.net}</td><td class="g">${y.rec}</td><td>${y.recErr}</td><td>${pct(y.recPct)}</td></tr>`; }).join('');
  app.innerHTML = `<div class="page"><div class="top"><button class="ib" data-act="pl-back">←</button><div class="ttl">${esc(d.p.name)}<span class="sub">Kausi – ${esc(d.team?.name || '')}</span></div><button class="ib" data-act="pl-share" aria-label="Jaa yhteenveto">⇪</button></div>
  ${n ? `<div class="pl">
    <div class="hero"><div class="no">${esc(d.p.num || '–')}</div><div><h2>${esc(d.p.name)}</h2><div class="sub2">${n} ${n === 1 ? 'peli' : 'peliä'} tilastoitu · ${esc(d.team?.name || '')}</div></div></div>
    <div class="kpis">${kpi(x.pts, 'Pisteet', (x.pts / n).toFixed(1).replace('.', ',') + ' / peli')}${kpi(fmtPM(x.pm), '+/−', fmtPM(Math.round(x.pm / n * 10) / 10).toString().replace('.', ',') + ' / peli')}${kpi(pct(x.srvPct), 'Syöttö', x.srv + ' syöttöä · ' + x.ace + ' ässää')}${kpi(pct(x.recPct), 'Vastaanotto', x.rec + ' vast.')}${kpi(d.hasInP ? pct(x.attPct) : x.pt, d.hasInP ? 'Hyökkäys-%' : 'Hyök. pist.', d.hasInP ? x.pt + ' pist. / ' + x.att : '')}${kpi(x.blk, 'Torjunnat', x.net ? x.net + ' verkkovirh.' : '')}</div>
    <div class="two">
      <div class="box str"><h3>Vahvuudet</h3><ul>${list(ins.str) || none('Ei vielä selkeitä vahvuuksia. Tulokset tarkentuvat kun yrityksiä kertyy (vähintään 10 per osa-alue).')}</ul></div>
      <div class="box dev"><h3>Kehityskohteet</h3><ul>${list(ins.dev) || none('Ei vielä selkeitä kehityskohteita tilastojen perusteella.')}</ul></div>
    </div>
    <div class="box trd"><h3>Kehitys otteluittain</h3><ul>${list(ins.trd) || none(n < 4 ? 'Kehityssuunta näkyy kun pelejä on vähintään 4.' : 'Ei merkittäviä muutoksia viime peleissä.')}</ul></div>
    <div class="charts">
      <div class="box ch"><h3>Pisteet / peli</h3>${barChart(d.rows, y => y.pts)}</div>
      <div class="box ch"><h3>Vastaanotto, hyvä %</h3>${barChart(d.rows, y => y.recPct, { pct: true, cls: 'b2' })}</div>
      <div class="box ch"><h3>Syöttö, onnistui %</h3>${barChart(d.rows, y => y.srvPct, { pct: true, cls: 'b3' })}</div>
    </div>
    <div class="box" style="padding:0"><h3 style="padding:12px 12px 0;margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)">Ottelut</h3><div class="tw"><table class="st"><thead>
      <tr><th class="n" rowspan="2">Peli</th><th rowspan="2">Pist.</th><th rowspan="2">+/−</th><th class="g" colspan="4">Syöttö</th><th class="g" colspan="3">Hyökkäys</th><th class="g" colspan="2">Torj.</th><th class="g" colspan="3">Vastaanotto</th></tr>
      <tr><th class="g">Yht</th><th>Ässä</th><th>Virh.</th><th>%</th><th class="g">Piste</th><th>Virhe</th><th>Tehok.</th><th class="g">Torj.</th><th>Verkko</th><th class="g">Yht</th><th>Virh.</th><th>%</th></tr></thead>
      <tbody>${trs}</tbody></table></div></div>
    <div class="note" style="padding:0 2px">Vahvuudet ja kehityskohteet verrataan joukkueen kauden keskiarvoon, ja ne näytetään vasta kun osa-alueelta on vähintään 10 yritystä. Ne ovat keskustelun pohja, eivät tuomio: tilasto kertoo mitä pelissä tapahtui, valmentajan silmä kertoo miksi.</div>
  </div>` : `<div class="note" style="padding:24px 12px">Pelaajalla ei ole vielä kirjauksia tällä kaudella.</div>`}</div>`;
}
act['pl-open'] = el => go(`#/player/${S.seasonTeam}/${encodeURIComponent(el.dataset.pid)}`);
act['pl-back'] = () => go('#/season/' + S.seasonTeam);
act['pl-share'] = async () => {
  const d = playerData(S.seasonTeam, S.plId), text = playerText(d, playerInsights(d));
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Yhteenveto kopioitu', 'ok'); }
  catch { openModal(`<h3>Yhteenveto</h3><textarea rows="12" style="width:100%" readonly>${esc(text)}</textarea><div class="btns"><button class="btn pri" data-act="close">Sulje</button></div>`); }
};

act['season-csv'] = () => { const { team, rows, gp } = seasonData(); downloadCSV(`${team?.name}_kausi`, rows, gp); };

/* =========================================================
   Tapahtumankäsittely + käynnistys
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = act[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
function isStandalone() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEv = e; });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
act.install = async () => {
  if (S.installEv) { const e = S.installEv; S.installEv = null; e.prompt(); return; }
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  openModal(`<h3>Asenna kotivalikkoon</h3><p>${ios ? 'Avaa sivu Safarilla, napauta alareunan <b>Jaa</b>-kuvaketta (neliö ja nuoli ylös) ja valitse <b>Lisää Koti-valikkoon</b>.' : 'Avaa selaimen valikko (⋮) ja valitse <b>Asenna sovellus</b> tai <b>Lisää aloitusnäytölle</b>.'}</p><p class="mut small">Sovellus aukeaa sen jälkeen omasta kuvakkeestaan koko ruudulla.</p><div class="btns"><button class="btn pri" data-act="close">Selvä</button></div>`);
};
(async function boot() {
  const code = window.SPACE_CODE || 'jyle-kausi-2026';
  try { await initBackend(code); enter(code); }
  catch (e) {
    console.error(e);
    app.innerHTML = `<div class="page"><div class="wrap"><div class="card"><b>Yhteys epäonnistui</b><p class="mut">${esc(e.code || e.message)}</p><button class="btn pri" onclick="location.reload()">Yritä uudelleen</button></div></div></div>`;
  }

</script>
