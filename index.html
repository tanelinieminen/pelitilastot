<title>Pelitilastot</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#14181f;--mut:#5b6472;--line:#d6dae1;--pri:#1257d6;--pri-ink:#fff;--ok:#0f7a56;--bad:#c42b2b;--mid:#a85f00;--ace:#6b3fd0;--sel:#14181f}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#181c23;--ink:#eef0f4;--mut:#9aa3b2;--line:#2c323d;--pri:#4b86f5;--pri-ink:#fff;--ok:#1a9a70;--bad:#e0504f;--mid:#c47a10;--ace:#8a62ea;--sel:#eef0f4}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;touch-action:manipulation}
#app{height:100%}
.hide{display:none!important}
.top{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-weight:400;font-size:12px;color:var(--mut);display:block}
.ib{background:transparent;border:1px solid var(--line);border-radius:10px;min-width:42px;height:42px;font-size:20px;color:var(--ink)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45}
.wrap{padding:12px;max-width:760px;margin:0 auto}
.page{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.mut{color:var(--mut)}
.small{font-size:13px}
h2{font-size:15px;margin:16px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=tel],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);min-height:46px}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.gitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.gitem b{font-size:17px}
.gitem.fx{display:flex;align-items:center;gap:10px}
.pill{flex:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.pill.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
#net{position:fixed;right:8px;bottom:8px;z-index:50;background:#b42318;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:42%;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:16px;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .12s}
#toast.show{opacity:.97}
#toast.t-bad{background:var(--bad);color:#fff}#toast.t-ok{background:var(--ok);color:#fff}#toast.t-ace{background:var(--ace);color:#fff}#toast.t-mid{background:var(--mid);color:#fff}
.banner{background:#fff4d6;color:#5c3d00;border-bottom:1px solid #f0d58a;padding:8px 12px;font-size:13px}
/* modal */
#modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 10px;font-size:19px}
.sheet .btns{display:flex;gap:8px;margin-top:14px}
.sheet .btns .btn{flex:1}
.prow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.prow input:first-child{width:62px;flex:none}
.prow .btn{min-height:46px;padding:0 12px}
/* game */
.gscreen{height:100%;display:flex;flex-direction:column}
.bar{display:flex;gap:8px;padding:6px 10px;align-items:center;background:var(--card);border-bottom:1px solid var(--line)}
.setc{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.setc button{background:transparent;width:42px;height:40px;font-size:20px;color:var(--ink)}
.setc span{min-width:62px;text-align:center;font-weight:800}
.setbtn{flex:none;height:40px;border-radius:10px;border:1px solid var(--pri);background:var(--card);padding:0 12px;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap}
.setbtn small{font-weight:700;font-size:12px;color:var(--pri)}
.undo{flex:1;min-width:0;height:40px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:14px;padding:0 10px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;padding:5px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.tabs .chip{flex:1;text-align:center;border-radius:10px;min-height:38px;padding:6px 4px;font-size:14px}
.gbody{flex:1;min-height:0;display:flex;flex-direction:column}
.gmain{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.gmain>*{flex-shrink:0}
/* matala (vaaka-asennossa oleva) näyttö: tiivis yläosa; tilasto- ja kirjausloki-välilehdillä koko sivu vierii, jotta taulukolle jää tilaa */
@media (max-height:520px){
.gscreen .top{padding-top:4px;padding-bottom:4px}.gscreen .bar{padding:3px 10px}.gscreen .tabs{padding:3px 10px}
.gscreen .tabs .chip{min-height:32px;padding:3px 4px}.setbtn,.undo,.setc button{height:34px}
.gscreen.flow{height:auto;min-height:100%}.gscreen.flow .gbody{display:block;min-height:0}.gscreen.flow .gmain{display:block;overflow:visible}
.gscreen.flow .tabs{position:sticky;top:0;z-index:5}
.gscreen .ab{height:44px;font-size:16px}.gscreen .ab.wide{font-size:14px}.gscreen .acts{padding-top:4px;padding-bottom:4px}.gscreen .arow{margin-bottom:4px}.gscreen .pc{min-height:60px}
}
.tsbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px}
.tsbar .btn{min-height:34px;padding:4px 12px;font-size:14px;text-decoration:none;color:inherit}
#tsframe{display:block;width:100%;height:calc(100% - 48px);border:0;background:#fff}
.lurow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 10px 0;font-size:14px}
.lurow .btn{min-height:34px;padding:4px 12px;font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(84px,1fr);gap:8px;padding:8px;flex:1 0 auto}
.pgrid.many{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(66px,1fr)}
.pc{background:var(--card);border:2px solid var(--line);border-radius:14px;min-height:64px;max-height:150px;padding:4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.15}
.pc b{font-size:34px;font-weight:800;line-height:1}
.pc span{font-weight:700;font-size:16px;letter-spacing:-.2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgrid.many .pc b{font-size:28px}.pgrid.many .pc span{font-size:14px}
.pc small{display:none;font-size:12px;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc i{font-style:normal;font-size:12px;color:var(--mut);margin-top:1px;min-height:12px}
.pc.sel{background:var(--sel);border-color:var(--sel);color:var(--bg)}
.pc.sel small,.pc.sel i{color:var(--bg);opacity:.8}
.acts{background:var(--card);border-top:1px solid var(--line);padding:8px 8px max(8px,env(safe-area-inset-bottom))}
.selline{font-weight:800;font-size:16px;padding:0 4px 4px;min-height:30px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.selline>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl{max-width:80%;overflow:hidden;text-overflow:ellipsis;flex:none;font-style:normal;font-size:14px;color:#fff;border-radius:8px;padding:4px 10px;white-space:nowrap}
.fl.t-ok{background:var(--ok)}.fl.t-bad{background:var(--bad)}.fl.t-ace{background:var(--ace)}.fl.t-mid{background:var(--mid)}
.selline.none{color:var(--mut);font-weight:600}
.arow{display:flex;gap:6px;margin-top:5px}
.arow .lbl{width:76px;flex:none;font-size:12px;font-weight:700;color:var(--mut);display:flex;align-items:center}
.ab{flex:1;height:48px;border-radius:12px;color:#fff;font-weight:800;font-size:16px;line-height:1.05;padding:0 4px}
.ab.wide{flex:1.7;font-size:14px}
@media (min-width:820px){.ab.wide{font-size:17px}}
.ab:active{filter:brightness(.8);transform:scale(.98)}
.ab.ok{background:var(--ok)}.ab.bad{background:var(--bad)}.ab.mid{background:var(--mid)}.ab.ace{background:var(--ace)}
.acts.off .ab{opacity:.45}
@media (min-width:820px){.gbody{flex-direction:row}.acts{width:420px;flex:none;border-top:0;border-left:1px solid var(--line);overflow:auto}.ab{height:72px;font-size:18px}.pgrid,.pgrid.many{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));grid-auto-rows:auto;flex:none;align-content:start}.pc{min-height:76px}.pgrid.many .pc b{font-size:26px}.pgrid.many .pc span{font-size:14px}.pc small{display:block}.pc span{font-size:14px}.pc b{font-size:26px}}
/* stats */
.tw{overflow:auto;padding:8px}
table.st{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.st th,table.st td{padding:8px 7px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
table.st th{background:var(--bg);font-size:12px;color:var(--mut)}
table.st td.n,table.st th.n{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;border-right:1px solid var(--line)}
table.st th.n{background:var(--bg)}
table.st .g{border-left:2px solid var(--line)}
table.st tfoot td{font-weight:800;background:var(--bg)}
table.st td.v-ok{color:var(--ok);font-weight:700}table.st td.v-bad{color:var(--bad);font-weight:700}table.st td.v-ace{color:var(--ace);font-weight:700}
.evl{padding:0 10px 14px}
.ev{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:6px;min-height:52px;font-size:15px}
.evl div{padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.note{font-size:12px;color:var(--mut);padding:2px 12px 10px}
</style>

<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="net" class="hide">Ei verkkoyhteyttä – kirjaukset tallentuvat, kun yhteys palaa</div>

<script type="module">
/* =========================================================
   Perusapurit
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? `${+m[3]}.${+m[2]}.${m[1]}` : (s || ''); };
const num = p => parseInt(p.num, 10);
const byNum = (a, b) => (num(a) || 999) - (num(b) || 999) || a.name.localeCompare(b.name, 'fi');
const surname = n => (n || '').trim().split(/\s+/)[0] || '';
const firstname = n => (n || '').trim().split(/\s+/).slice(1).join(' ');
function setPath(o, path, val) { const k = path.split('.'); let c = o; for (const x of k.slice(0, -1)) c = (c[x] ??= {}); c[k.at(-1)] = val; }
function resInfo(g) {
  const parts = []; let w = 0, l = 0;
  for (const k of Object.keys(g.res || {}).sort()) { const r = g.res[k]; if (r.us != null && r.opp != null) { parts.push(`${r.us}–${r.opp}`); if (r.us > r.opp) w++; else if (r.us < r.opp) l++; } }
  return { w, l, parts, any: parts.length > 0 };
}
const resTxt = g => { const r = resInfo(g); return r.any ? `${r.w}–${r.l} (${r.parts.join(', ')})` : ''; };
const normName = n => (n || '').toLowerCase().replace(/\s+/g, ' ').trim();

/* =========================================================
   Taustajärjestelmä 1: paikallinen testitila (localStorage)
   ========================================================= */
function bump(g, ev, d) {
  const inc = (keys) => { let o = g; for (const k of keys.slice(0, -1)) o = (o[k] ??= {}); const l = keys.at(-1); o[l] = (o[l] || 0) + d; };
  inc(['tot', ev.pid, ev.type]); inc(['sets', 's' + ev.set, ev.pid, ev.type]); g.n = (g.n || 0) + d;
}
function makeLocal(code) {
  const key = 'bs_local_' + code;
  const db = LS.get(key, null) || { teams: {}, games: {}, events: {} };
  const subs = new Set();
  const save = () => { LS.set(key, db); [...subs].forEach(f => f()); };
  const watch = (compute, cb) => { const f = () => cb(structuredClone(compute())); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); };
  return {
    local: true,
    async hasSpace() { return LS.get(key, null) !== null; },
    async createSpace() { save(); },
    watchTeams: cb => watch(() => Object.values(db.teams), cb),
    async saveTeam(t) { t.id = t.id || uid(); db.teams[t.id] = t; save(); return t.id; },
    watchGames: (tid, cb) => watch(() => Object.values(db.games).filter(g => g.teamId === tid), cb),
    watchAllGames: (tid, cb) => watch(() => Object.values(db.games).filter(g => g.teamId === tid), cb),
    watchGame: (gid, cb) => watch(() => db.games[gid] || null, cb),
    watchEvents: (gid, cb) => watch(() => (db.events[gid] || []).slice(-300).reverse(), cb),
    async createGame(g) { const id = g.id || uid(); db.games[id] = { ...(db.games[id] || { tot: {}, sets: {}, n: 0 }), ...g, id }; db.events[id] ||= []; save(); return id; },
    async patchGame(gid, f) { if (db.games[gid]) { for (const [k, v] of Object.entries(f)) setPath(db.games[gid], k, v); save(); } },
    record(gid, ev) { const g = db.games[gid]; if (!g) return; bump(g, ev, 1); (db.events[gid] ||= []).push({ ...ev, id: uid(), ts: Date.now() }); save(); },
    undo(gid, ev) { const g = db.games[gid]; if (!g) return; bump(g, ev, -1); db.events[gid] = (db.events[gid] || []).filter(e => e.id !== ev.id); save(); },
    editEvent(gid, old, neu) { const g = db.games[gid]; if (!g) return; bump(g, old, -1); bump(g, neu, 1); const e = (db.events[gid] || []).find(x => x.id === old.id); if (e) Object.assign(e, { pid: neu.pid, type: neu.type, set: neu.set }); save(); },
    async deleteGame(gid) { delete db.games[gid]; delete db.events[gid]; save(); }
  };
}

/* =========================================================
   Taustajärjestelmä 2: Firebase Firestore
   ========================================================= */
let FB = null;
async function loadFirebase(cfg) {
  if (FB) return FB;
  const V = '10.12.2';
  const [a, f] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
  ]);
  const fapp = a.initializeApp(cfg);
  let db;
  try { db = f.initializeFirestore(fapp, { localCache: f.persistentLocalCache({ tabManager: f.persistentMultipleTabManager() }) }); }
  catch (e) { console.warn('Offline-välimuisti ei käytössä', e); db = f.getFirestore(fapp); }
  FB = { f, db };
  return FB;
}
function makeFirestore(code, { f, db }) {
  const col = (...p) => f.collection(db, 't', code, ...p);
  const dref = (...p) => f.doc(db, 't', code, ...p);
  const err = e => { console.error(e); toast('Yhteysvirhe: ' + (e.code || e.message), 'bad', 4000); };
  const inc = n => f.increment(n);
  return {
    local: false,
    async hasSpace() { return (await f.getDoc(dref('meta', 'info'))).exists(); },
    async createSpace() { await f.setDoc(dref('meta', 'info'), { created: Date.now() }); },
    watchTeams: cb => f.onSnapshot(col('teams'), s => cb(s.docs.map(d => ({ ...d.data(), id: d.id })), s.metadata.fromCache), err),
    async saveTeam(t) {
      const id = t.id || f.doc(col('teams')).id;
      f.setDoc(dref('teams', id), { name: t.name, players: t.players, updated: Date.now() }).catch(err);
      return id;
    },
    watchGames: (tid, cb) => f.onSnapshot(f.query(col('games'), f.where('teamId', '==', tid)), s => cb(s.docs.map(d => ({ ...d.data(), id: d.id }))), err),
    watchAllGames: (tid, cb) => f.onSnapshot(f.query(col('games'), f.where('teamId', '==', tid)), s => cb(s.docs.map(d => ({ ...d.data(), id: d.id }))), err),
    watchGame: (gid, cb) => f.onSnapshot(dref('games', gid), s => cb(s.exists() ? { ...s.data(), id: s.id } : null), err),
    watchEvents: (gid, cb) => f.onSnapshot(f.query(col('games', gid, 'events'), f.orderBy('ts', 'desc'), f.limit(300)), s => cb(s.docs.map(d => ({ ...d.data(), id: d.id }))), err),
    async createGame(g) {
      const { id, ...data } = g;
      f.setDoc(dref('games', id), data, { merge: true }).catch(err);   // merge: ei koskaan nollaa jo kirjattuja tilastoja
      return id;
    },
    async patchGame(gid, fields) { f.updateDoc(dref('games', gid), fields).catch(err); },
    record(gid, ev) {
      const b = f.writeBatch(db);
      b.set(f.doc(col('games', gid, 'events')), { ...ev, ts: Date.now() });
      b.update(dref('games', gid), { [`tot.${ev.pid}.${ev.type}`]: inc(1), [`sets.s${ev.set}.${ev.pid}.${ev.type}`]: inc(1), n: inc(1) });
      b.commit().catch(err);   // ei odoteta: toimii myös ilman verkkoa
    },
    undo(gid, ev) {
      const b = f.writeBatch(db);
      b.delete(dref('games', gid, 'events', ev.id));
      b.update(dref('games', gid), { [`tot.${ev.pid}.${ev.type}`]: inc(-1), [`sets.s${ev.set}.${ev.pid}.${ev.type}`]: inc(-1), n: inc(-1) });
      b.commit().catch(err);
    },
    editEvent(gid, old, neu) {
      const d = {}, add = (ev, n) => { for (const k of [`tot.${ev.pid}.${ev.type}`, `sets.s${ev.set}.${ev.pid}.${ev.type}`]) d[k] = (d[k] || 0) + n; };
      add(old, -1); add(neu, 1);
      const upd = {}; for (const [k, v] of Object.entries(d)) if (v) upd[k] = inc(v);
      const b = f.writeBatch(db);
      b.update(dref('games', gid, 'events', old.id), { pid: neu.pid, type: neu.type, set: neu.set });
      if (Object.keys(upd).length) b.update(dref('games', gid), upd);
      b.commit().catch(err);
    },
    async deleteGame(gid) {
      const snap = await f.getDocs(col('games', gid, 'events'));
      for (let i = 0; i < snap.docs.length; i += 400) {
        const b = f.writeBatch(db);
        snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
        await b.commit();
      }
      await f.deleteDoc(dref('games', gid));
    }
  };
}
const useFirebase = () => { const c = window.FIREBASE_CONFIG; return !!(c && c.apiKey && !/TÄYTÄ|YOUR|XXXX/i.test(c.apiKey)); };

const g0 = (c, t) => (c && c[t]) || 0;
const sumC = c => TYPES.reduce((a, t) => a + g0(c, t), 0);
function calc(c) {
  const srv = g0(c, 'srv_ok') + g0(c, 'srv_err') + g0(c, 'srv_ace');
  const rec = g0(c, 'rec_good') + g0(c, 'rec_mid') + g0(c, 'rec_err');
  return {
    srv, srvOk: g0(c, 'srv_ok'), srvErr: g0(c, 'srv_err'), ace: g0(c, 'srv_ace'),
    srvPct: srv ? Math.round((g0(c, 'srv_ok') + g0(c, 'srv_ace')) / srv * 100) : null,
    pt: g0(c, 'pt'), err: g0(c, 'err'), blk: g0(c, 'blk'), net: g0(c, 'net'),
    rec, recGood: g0(c, 'rec_good'), recMid: g0(c, 'rec_mid'), recErr: g0(c, 'rec_err'),
    recPct: rec ? Math.round(g0(c, 'rec_good') / rec * 100) : null,
    // +/-: pisteet (hyökkäys + ässä + torjunta) miinus virheet (hyökkäysvirhe + syöttövirhe + verkkovirhe + vastaanottovirhe)
    pts: g0(c, 'pt') + g0(c, 'srv_ace') + g0(c, 'blk'),
    pm: g0(c, 'pt') + g0(c, 'srv_ace') + g0(c, 'blk') - (g0(c, 'err') + g0(c, 'srv_err') + g0(c, 'net') + g0(c, 'rec_err'))
  };
}
const addC = (a, b) => { const o = { ...a }; for (const t of TYPES) if (b && b[t]) o[t] = (o[t] || 0) + b[t]; return o; };
const pct = v => v === null ? '–' : v + '%';
const fmtPM = n => n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0';
function statRows(team, countsByPid) {
  const ids = new Set(Object.keys(countsByPid).filter(pid => sumC(countsByPid[pid]) > 0));
  const known = new Map((team?.players || []).map(p => [p.id, p]));
  const rows = [...ids].map(pid => ({ p: known.get(pid) || { id: pid, num: '', name: '(poistettu pelaaja)' }, c: countsByPid[pid] }));
  rows.sort((a, b) => byNum(a.p, b.p));
  return rows;
}
function statTable(rows, { games } = {}) {
  if (!rows.length) return `<div class="note" style="padding:24px 12px">Ei kirjauksia vielä.</div>`;
  let tot = {}; rows.forEach(r => { tot = addC(tot, r.c); });
  const cell = (c, name) => {
    const x = calc(c);
    return `<td><b>${x.pts}</b></td><td class="${x.pm > 0 ? 'v-ok' : x.pm < 0 ? 'v-bad' : ''}"><b>${fmtPM(x.pm)}</b></td><td class="g">${x.srv}</td><td>${x.srvOk}</td><td class="${x.ace ? 'v-ace' : ''}">${x.ace}</td><td class="${x.srvErr ? 'v-bad' : ''}">${x.srvErr}</td><td>${pct(x.srvPct)}</td>
      <td class="g ${x.pt ? 'v-ok' : ''}">${x.pt}</td><td class="${x.err ? 'v-bad' : ''}">${x.err}</td>
      <td class="g ${x.blk ? 'v-ok' : ''}">${x.blk}</td><td class="${x.net ? 'v-bad' : ''}">${x.net}</td>
      <td class="g">${x.rec}</td><td class="${x.recGood ? 'v-ok' : ''}">${x.recGood}</td><td>${x.recMid}</td><td class="${x.recErr ? 'v-bad' : ''}">${x.recErr}</td><td>${pct(x.recPct)}</td>`;
  };
  return `<div class="tw"><table class="st"><thead>
    <tr><th class="n" rowspan="2">Pelaaja</th>${games ? '<th rowspan="2">Pelit</th>' : ''}<th rowspan="2">Pist.</th><th rowspan="2">+/−</th><th class="g" colspan="5">Syöttö</th><th class="g" colspan="2">Hyökkäys</th><th class="g" colspan="2">Torjunta / verkko</th><th class="g" colspan="5">Vastaanotto</th></tr>
    <tr><th class="g">Yht</th><th>Onn.</th><th>Ässä</th><th>Virh.</th><th>%</th><th class="g">Piste</th><th>Virhe</th><th class="g">Torjunta</th><th>Verkkovirhe</th><th class="g">Yht</th><th>Hyvä</th><th>Kesk. ei mahd.</th><th>Virh.</th><th>%</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td class="n"><b>${esc(r.p.num)}</b> ${esc(r.p.name)}</td>${games ? `<td>${games[r.p.id] || 0}</td>` : ''}${cell(r.c)}</tr>`).join('')}</tbody>
    <tfoot><tr><td class="n">Yhteensä</td>${games ? '<td></td>' : ''}${cell(tot)}</tr></tfoot></table></div>
    <div class="note">Pist. = hyökkäyspisteet + ässät + torjunnat. Syöttö-% = (onnistui + ässä) / kaikki syötöt. Vastaanotto-% = hyvät / kaikki vastaanotot. “Kesk. ei mahd.” = keskihyökkäys ei mahdollinen. +/− = pisteet (hyökkäys + ässä + torjunta) miinus virheet (hyökkäysvirhe + syöttövirhe + verkkovirhe + vastaanottovirhe).</div>`;
}
function downloadCSV(name, rows, games) {
  const head = ['Numero', 'Pelaaja', ...(games ? ['Pelit'] : []), 'Pisteet', '+/-', 'Syötöt', 'Onnistui', 'Syöttövirhe', 'Ässä', 'Syöttö-%', 'Hyökkäyspisteet', 'Hyökkäysvirheet', 'Torjunnat', 'Verkkovirheet', 'Vastaanotot', 'Hyvä', 'Keskihyökkäys ei mahdollinen', 'Vastaanottovirhe', 'Vastaanotto-%'];
  const lines = [head, ...rows.map(r => { const x = calc(r.c); return [r.p.num, r.p.name, ...(games ? [games[r.p.id] || 0] : []), x.pts, x.pm, x.srv, x.srvOk, x.srvErr, x.ace, x.srvPct ?? '', x.pt, x.err, x.blk, x.net, x.rec, x.recGood, x.recMid, x.recErr, x.recPct ?? '']; })];
  const csv = '﻿' + lines.map(l => l.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name.replace(/[^\wåäöÅÄÖ.-]+/g, '_') + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}

const act = {};
const slug = n => normName(n).replace(/[^a-z0-9åäö]/g, '');
const seeded = new Set();
function seedTeams(ts, fromCache) {
  if (fromCache) return;  // luodaan vain, kun palvelimelta on varmistettu ettei joukkuetta ole
  for (const t of window.JOUKKUEET || []) {
    if (seeded.has(t.id) || ts.some(x => x.id === t.id)) continue;
    seeded.add(t.id);
    backend.saveTeam({ id: t.id, name: t.name, players: (t.players || []).map(([n, name]) => ({ id: 'p_' + slug(name), num: String(n), name })) });
  }
}
function enter(code) {
  S.code = code; S.teamsLoaded = false;
  S.teamsUnsub = backend.watchTeams((ts, fromCache) => {
    S.teams = ts.sort((a, b) => a.name.localeCompare(b.name, 'fi')); S.teamsLoaded = true;
    seedTeams(ts, fromCache); refresh();
  });
  route();
  if (!LS.get('bs_name', '')) askName();
}

      ${past.length ? `<h2>Pelatut ottelut</h2>${past.map(g => `<button class="gitem" data-act="game-open" data-id="${g.id}"><b>${esc(g.home && g.away ? g.home + ' – ' + g.away : g.opponent || 'Peli')}</b><div class="mut small">${fmtDate(g.date)}${g.finished ? ' · päättynyt' : ''}${resTxt(g) ? ' · ' + esc(resTxt(g)) : ''} · ${g.n || 0} kirjausta</div></button>`).join('')}` : ''}`}

function parseRoster(text) {
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/\t+/g, ' ').replace(/\s+/g, ' ').trim();
    const m = /^(\d{1,3})\s+([^\d]+?)\s*(?:\d.*)?$/.exec(line);
    if (m && m[2].trim().length > 2 && !/^(Joukkue|Valmentaja|Nimi)/i.test(m[2].trim())) out.push({ num: m[1], name: m[2].trim() });
  }
  return out;
}

}
act.gmenu = gameMenu;
act['game-csv'] = () => { const g = S.game, team = S.teams.find(t => t.id === g.teamId); downloadCSV(`${team?.name}_${g.opponent}_${g.date}`, statRows(team, g.tot || {})); };
act['game-del-ask'] = () => confirmModal('Poistetaanko peli ja kaikki sen kirjaukset pysyvästi?', 'game-del');
act['game-del'] = async () => { const id = S.game.id; closeModal(); try { await backend.deleteGame(id); } catch (e) { toast('Poisto epäonnistui', 'bad'); return; } go('#/'); };
function lineupModal() {
  const g = S.game, team = S.teams.find(t => t.id === g.teamId), ab = new Set(g.absent || []);
  const ps = (team?.players || []).filter(p => !p.hidden).sort(byNum);
  openModal(`<h3>Ketkä pelaavat?</h3><p class="mut small">Napauta pelaaja pois, jos hän ei ole mukana tässä pelissä. Mukana olevat on merkitty tummalla (${ps.length - ps.filter(p => ab.has(p.id)).length}/${ps.length}).</p>
    <div class="chips">${ps.map(p => `<button class="chip ${ab.has(p.id) ? '' : 'on'}" data-act="toggle-absent" data-id="${p.id}">${esc(p.num)} ${esc(surname(p.name))}</button>`).join('')}</div>
    <div class="btns"><button class="btn" data-act="lineup-all">Kaikki mukana</button><button class="btn pri" data-act="lineup-done">Valmis</button></div>`);
}
act['lineup-all'] = () => { S.game.absent = []; backend.patchGame(S.game.id, { absent: [] }); lineupModal(); updateGame(); };
act['lineup-done'] = () => { closeModal(); S.game.lu = true; backend.patchGame(S.game.id, { lu: true }); updateGame(); };
act.lineup = lineupModal;
act['toggle-absent'] = el => {
  const s = new Set(S.game.absent || []); s.has(el.dataset.id) ? s.delete(el.dataset.id) : s.add(el.dataset.id);
  S.game.absent = [...s]; backend.patchGame(S.game.id, { absent: S.game.absent }); lineupModal(); updateGame();
};

/* =========================================================
   Kausitilastot
   ========================================================= */
function mountSeason(tid) {
  S.view = 'season'; S.seasonTeam = tid; S.seasonGames = [];
  S.subs.push(backend.watchAllGames(tid, gs => { S.seasonGames = gs; updateSeason(); }));
  updateSeason();
}
function seasonData() {
  const team = S.teams.find(t => t.id === S.seasonTeam); let agg = {}; const gp = {};
  for (const g of S.seasonGames) for (const [pid, c] of Object.entries(g.tot || {})) { if (sumC(c) > 0) { agg[pid] = addC(agg[pid] || {}, c); gp[pid] = (gp[pid] || 0) + 1; } }
  return { team, rows: statRows(team, agg), gp };
}
function updateSeason() {
  if (S.view !== 'season') return;
  const { team, rows, gp } = seasonData();
  app.innerHTML = `<div class="page"><div class="top"><button class="ib" data-act="home">←</button><div class="ttl">Kausi – ${esc(team?.name || '')}<span class="sub">${S.seasonGames.length} peliä</span></div><button class="ib" data-act="season-csv" aria-label="CSV">⬇</button></div>
    ${statTable(rows, { games: gp })}</div>`;
}
act['season-csv'] = () => { const { team, rows, gp } = seasonData(); downloadCSV(`${team?.name}_kausi`, rows, gp); };

/* =========================================================
   Tapahtumankäsittely + käynnistys
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = act[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
(async function boot() {
  const code = window.SPACE_CODE || 'jyle-kausi-2026';
  try { await initBackend(code); enter(code); }
  catch (e) {
    console.error(e);
    app.innerHTML = `<div class="page"><div class="wrap"><div class="card"><b>Yhteys epäonnistui</b><p class="mut">${esc(e.code || e.message)}</p><button class="btn pri" onclick="location.reload()">Yritä uudelleen</button></div></div></div>`;
  }
})();
</script>
</body>
</html>
